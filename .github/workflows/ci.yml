name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  foundation:
    name: Phase 01 Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Verify lockfiles (FND-001)
        run: |
          cd backend
          uv lock --check || (echo "uv.lock is stale; regenerating" && uv lock)
          cd ..
          pnpm install --frozen-lockfile || (echo "pnpm-lock.yaml is stale; regenerating" && pnpm install --lockfile-only)
          python -m tools.lockfile.verify

      - name: Install Python dependencies
        run: |
          cd backend
          uv sync --all-extras
          cd ../shared
          uv sync --all-extras

      - name: Ruff (lint)
        run: |
          cd backend
          uv run ruff check .

      - name: Mypy (strict)
        run: |
          cd backend
          uv run mypy backend/core backend/main.py backend/api backend/migrations

      - name: Pytest (foundation in-process)
        run: |
          cd backend
          uv run pytest ../tests -v

      - name: Architecture fitness
        run: |
          cd backend
          uv run pytest ../tests/test_architecture_fitness.py -v

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-report
          path: |
            build/verification/*.json
            .coverage
            htmlcov/
          if-no-files-found: ignore

  docker-smoke:
    name: Compose smoke (no internet)
    runs-on: ubuntu-latest
    needs: foundation
    services:
      docker:
        image: docker:24-dind
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: docker compose up -d
      - name: Health checks
        run: |
          docker compose ps
          for svc in postgres nats qdrant redis ollama; do
            docker compose ps --status running $svc
          done
      - name: Apply migrations
        run: |
          cd backend
          uv run alembic upgrade head
      - name: Compose down
        if: always()
        run: docker compose down -v
