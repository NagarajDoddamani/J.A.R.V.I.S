[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS Backend Services"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic-settings>=2.3.1",
    "structlog>=24.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "nats-py>=2.7.2",
    "qdrant-client>=1.9.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jarvis-shared",
    "alembic>=1.13.1",
    "sqlalchemy>=2.0.30",
]

[tool.uv.sources]
jarvis-shared = { path = "../shared", editable = True }

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
